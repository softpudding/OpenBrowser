[project]
name = "local-chrome-server"
version = "0.1.0"
description = "Local Chrome Server for browser automation via Chrome extension"
authors = [
    {name = "OpenHands", email = "openhands@all-hands.dev"},
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "click>=8.1.0",
    "python-multipart>=0.0.6",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "openhands-sdk",
    "openhands-tools",
    "litellm @ git+https://github.com/softpudding/litellm.git@2eb7db59461e9117b1e3e0519616b39f1497c0f9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
local-chrome-server = "server.main:cli"
# chrome-cli = "cli.main:main"  # cli directory removed

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.uv]
override-dependencies = [
    "python-dotenv==1.1.1",
]

[tool.uv.sources]
openhands-sdk = { git = "https://github.com/softpudding/agent-sdk.git", subdirectory = "openhands-sdk", rev = "b7f39b826586f596caa5cfbf0e3b0e705d698155" }
openhands-tools = { git = "https://github.com/softpudding/agent-sdk.git", subdirectory = "openhands-tools", rev = "b7f39b826586f596caa5cfbf0e3b0e705d698155" }
