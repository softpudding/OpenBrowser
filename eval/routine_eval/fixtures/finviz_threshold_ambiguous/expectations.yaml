# Compiler expectations for fixture `finviz_threshold_ambiguous`.
#
# The recording shows the Market Cap dropdown being set to "mid",
# then immediately re-cleared to "Any". This is exactly the
# "filters that were touched but not changed" ambiguity class
# called out in the compiler system prompt — the compiler must ask
# the user whether the touch was intentional before writing the
# routine. Given the user's stated intent (keep it set to "mid"),
# the final routine must carry a `**Keywords:** fs_cap` (or `cap`)
# line on the select step.

intent_summary: |
  Open the Finviz screener and set the Market Cap dropdown to "mid"
  ("Mid ($2bln to $10bln)") — the user's intent is mid-cap stocks
  even though the recording ends with the dropdown reverted to "Any".

expected_questions:
  required:
    # The compiler must ask SOMETHING about the touched-then-cleared
    # Market Cap filter — either "was this intentional" or "which
    # value did you mean to keep". Any question that surfaces the
    # touch-then-revert pattern counts.
    - "Whether the Market Cap filter was intentional"
  forbidden:
    - "Which other filters to add"

expected_keywords:
  must_have_for_steps:
    - description: "the Market Cap <select> dropdown"
      acceptable_tokens:
        - fs_cap
        - cap
