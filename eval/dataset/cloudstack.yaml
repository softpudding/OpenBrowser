id: cloudstack
name: "CloudStack DAS Agent Test"
difficulty: hard
description: "AI Agent should find DAS console and greet the DAS agent"
start_url: "http://localhost:16605/cloudstack/"
instruction: "Find the DAS console and say hello to the DAS agent."
time_limit: 500.0  # ~8.3 minutes
cost_limit: 1.2    # 1.2 RMB

criteria:
  - type: navigate_to_das_console
    description: "Navigate to DAS console page"
    points: 1
    expected:
      event_type: page_view
      page: "/cloudstack/das.html"
  - type: open_das_agent
    description: "Open DAS agent interface"
    points: 1
    expected:
      event_type: click
      element_id: "das-agent-toggle"
      page: "/cloudstack/das.html"
    alternative:
      event_type: click
      element_id: "open-chat-btn"
      page: "/cloudstack/das.html"
  - type: greet_das_agent
    description: "Send a greeting message to DAS agent"
    points: 1
    expected:
      event_type: input
      element_id: "chat-input"
      value_length_min: 1
      page: "/cloudstack/das.html"
  - type: submit_greeting
    description: "Submit the greeting message"
    points: 0.5
    expected:
      event_type: click
      element_id: "send-btn"
      page: "/cloudstack/das.html"
    optional: true