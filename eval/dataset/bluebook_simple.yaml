id: bluebook_simple
name: "BlueBook Search And Like Test"
difficulty: medium
description: "Search for a specific post in the BlueBook feed, open it, and like the note."
start_url: "http://localhost:16605/bluebook/"
instruction: "在小蓝书首页，使用顶部搜索框搜索“阿里嘎多”，打开标题为“阿里嘎多，这套 AI 识图提示词模板真顶”的笔记，并点赞这篇笔记。"
time_limit: 300.0
cost_limit: 0.6

criteria:
  - type: execute_search
    description: "Use the header search with the target keyword"
    points: 1.5
    expected:
      event_type: search_execute
      query: "阿里嘎多"
      page: "/bluebook/"

  - type: open_target_note
    description: "Open the correct search result"
    points: 2
    expected:
      event_type: note_open
      noteId: "note-arigato-ai"
      noteTitle: "阿里嘎多，这套 AI 识图提示词模板真顶"
      page: "/bluebook/"

  - type: like_target_note
    description: "Like the correct note"
    points: 2.5
    expected:
      event_type: note_like_toggle
      noteId: "note-arigato-ai"
      noteTitle: "阿里嘎多，这套 AI 识图提示词模板真顶"
      liked: true
      page: "/bluebook/"
