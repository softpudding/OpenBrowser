id: techforum_reply
name: "TechForum Comment Reply Test"
difficulty: hard
description: "AI Agent should open comments, find 'Graduate Student' comment, and reply with a made-up paper name"
start_url: "http://localhost:16605/techforum/"
instruction: "On the first AI-related post (first post), open the comments section, find the comment by 'Graduate Student' asking for paper recommendations, and reply with a made-up paper name (e.g., 'Neural Architecture Search for Efficient Transformers' or any plausible AI paper title)."
time_limit: 500.0  # ~8.3 minutes - complex UI interaction
cost_limit: 1.0    # 1.0 RMB

criteria:
  # Original upvote action (might still happen)
  - type: upvote_action
    description: "Upvote the first AI-related post (optional but common)"
    points: 0.5
    expected:
      event_type: answer_action
      action: upvote
      questionId: "1"
      page: "/techforum/"
    optional: true
  
  # New: Open comments section
  - type: open_comments
    description: "Click to open comments section"
    points: 1
    expected:
      event_type: click
      element_class: "comment-toggle"
      page: "/techforum/"
    alternative:
      event_type: click
      element_text: "comment"
      page: "/techforum/"
  
  # New: Click "View allComment" button
  - type: view_all_comments
    description: "Click 'View allComment' button to see all comments"
    points: 1.5
    expected:
      event_type: click
      element_class: "view-all-comments-btn"
      page: "/techforum/"
    alternative:
      event_type: click
      element_text: "View allComment"
      page: "/techforum/"
  
  # New: Scroll to find Graduate Student comment
  # This is harder to verify directly, but we can check if they find the right comment
  - type: find_graduate_comment
    description: "Interact with Graduate Student comment (scroll to find it)"
    points: 2
    expected:
      event_type: scroll
      page: "/techforum/"
    alternative:
      event_type: comment_reply_click
      page: "/techforum/"
  
  # New: Click Reply button on Graduate Student comment
  - type: click_reply_button
    description: "Click Reply button to open reply input"
    points: 1.5
    expected:
      event_type: click
      element_text: "Reply"
      element_class: "comment-action-btn"
      page: "/techforum/"
    alternative:
      event_type: comment_reply_click
      page: "/techforum/"
  
  # New: Input paper name in comment field
  - type: input_paper_name
    description: "Input a made-up paper name in comment field"
    points: 2
    expected:
      event_type: input
      element_class: "comment-input-field"
      value_length_min: 5
      page: "/techforum/"
    alternative:
      event_type: input
      value_length_min: 5
      page: "/techforum/"
  
  # New: Submit the reply (optional - AI might not submit)
  - type: submit_reply
    description: "Submit the reply (optional)"
    points: 1
    expected:
      event_type: click
      element_text: "Reply"
      element_class: "reply-submit"
      page: "/techforum/"
    alternative:
      event_type: comment_reply_submit
      page: "/techforum/"
    optional: true