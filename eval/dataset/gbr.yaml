id: gbr
name: "GBR Search Test"
difficulty: easy
description: "AI Agent should search for 'fed' related news on Global Business Review"
start_url: "http://localhost:16605/gbr/"
instruction: "Search for all news related to 'fed' (Federal Reserve)."
time_limit: 400.0  # ~6.7 minutes
cost_limit: 0.8    # 0.8 RMB

criteria:
  - type: input_search_term
    description: "Input 'fed' into search input field"
    points: 1
    expected:
      event_type: input
      element_id: "search-input"
      value_length_min: 1
      page: "/gbr/"
  - type: click_search_button
    description: "Click the search submit button or search toggle"
    points: 1
    expected:
      event_type: click
      element_id: "search-submit"
      page: "/gbr/"
    alternative:
      event_type: click
      element_id: "search-toggle"
      page: "/gbr/"
  - type: verify_search_results
    description: "Verify search results page loaded"
    points: 0.5
    expected:
      event_type: page_view
      page_contains: "/gbr/search"
    optional: true