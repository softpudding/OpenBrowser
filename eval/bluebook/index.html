<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小蓝书 - 记录你的真实生活</title>
    <link rel="stylesheet" href="/bluebook/css/bluebook.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand-mark">
                <div class="brand-logo">小蓝书</div>
            </div>
            <nav class="sidebar-nav">
                <button class="sidebar-item active" data-nav="discover">
                    <span class="sidebar-icon">⌂</span>
                    <span>发现</span>
                </button>
                <button class="sidebar-item" data-nav="live">
                    <span class="sidebar-icon">◉</span>
                    <span>直播</span>
                </button>
                <button class="sidebar-item" data-nav="publish">
                    <span class="sidebar-icon">＋</span>
                    <span>发布</span>
                </button>
                <button class="sidebar-item" data-nav="notice">
                    <span class="sidebar-icon">◌</span>
                    <span>通知</span>
                </button>
                <button class="sidebar-item" data-nav="me">
                    <span class="sidebar-icon">◍</span>
                    <span>我</span>
                </button>
            </nav>
            <button class="sidebar-more">
                <span class="sidebar-icon">☰</span>
                <span>更多</span>
            </button>
        </aside>

        <div class="main-shell">
            <header class="topbar">
                <div class="search-shell">
                    <div class="input-box">
                        <input
                            id="search-input"
                            class="search-input"
                            type="text"
                            spellcheck="false"
                            placeholder="搜索小蓝书"
                            autocomplete="off"
                        >
                        <div class="input-button">
                            <div class="close-icon" id="search-clear" aria-label="清空搜索" role="button" tabindex="0">
                                <svg class="reds-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                    <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                                </svg>
                            </div>
                            <div class="search-icon" id="search-submit" aria-label="搜索" role="button" tabindex="0">
                                <svg class="reds-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                    <circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.7"/>
                                    <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>

                <nav class="top-links">
                    <a href="#" class="top-link">创作中心</a>
                    <a href="#" class="top-link">业务合作</a>
                </nav>
            </header>

            <section class="channel-bar" id="channel-bar"></section>

            <main class="feed-shell">
                <div class="floating-btn-sets">
                    <div id="image-note-filter-el" class="graphic-filter" role="button" tabindex="0" aria-label="只看图文">
                        <div class="btn-wrapper">
                            <svg class="reds-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="3" y="4" width="14" height="12" rx="3" stroke="currentColor" stroke-width="1.6"/>
                                <path d="M6 13L9.2 9.8L11.8 12.4L14 10.2L16 12.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="tip-container">
                            <span class="tip-text">只看图文</span>
                        </div>
                    </div>
                    <div class="reload" id="feed-reload" role="button" tabindex="0" aria-label="刷新">
                        <div class="btn-wrapper">
                            <svg class="reds-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M15.8 6.8V3.8M15.8 3.8H12.8M15.8 3.8L12.6 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M15 10A5.5 5.5 0 1 1 9.3 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="tip-container">
                            <span class="tip-text">刷新</span>
                        </div>
                    </div>
                </div>

                <div class="feed-status" id="feed-status"></div>
                <section class="note-grid" id="note-grid"></section>
            </main>
        </div>
    </div>

    <div class="note-detail-mask hidden" id="note-modal">
        <div class="note-container" id="note-container">
            <button class="modal-close" id="note-close" aria-label="关闭详情">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>

            <section class="media-container" id="modal-media"></section>

            <aside class="detail-panel">
                <div class="author">
                    <div class="author-wrapper">
                        <div class="author-avatar" id="modal-author-avatar"></div>
                        <div class="author-text">
                            <div class="author-name-row">
                                <span class="author-name" id="modal-author-name"></span>
                                <button class="follow-btn" id="modal-follow-btn">关注</button>
                            </div>
                            <div class="note-time" id="modal-note-time"></div>
                        </div>
                    </div>
                </div>

                <div class="detail-content">
                    <h1 class="detail-title" id="modal-title"></h1>
                    <div class="detail-tags" id="modal-tags"></div>
                    <p class="detail-desc" id="modal-desc"></p>
                </div>

                <div class="detail-comments">
                    <div class="comment-head">
                        <span id="modal-comment-summary"></span>
                    </div>
                    <div class="comment-list" id="comment-list"></div>
                </div>

                <div class="detail-footer">
                    <div class="detail-input-row">
                        <input id="quick-comment-input" class="quick-comment-input" type="text" placeholder="说点什么..." autocomplete="off">
                        <button id="quick-comment-send" class="quick-comment-send">发送</button>
                    </div>
                    <div class="detail-actions" id="detail-actions"></div>
                </div>
            </aside>
        </div>
    </div>

    <script src="/js/tracker.js"></script>
    <script src="/bluebook/js/bluebook.js"></script>
</body>
</html>
